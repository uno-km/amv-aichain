changelog:
- version: v1.2.0
  date: '2026-10-13'
  title: Fail-Fast Zero-Silent-Exception & ameva-runtime v2 Integration
  type: Production Release (Latest)
  summary_ko: '136개 유닛 테스트 전수 검증을 통해 침묵 예외(except: pass)를 전면 박멸하고, ameva-runtime v2 하드웨어 가속 연동 및 클러스터 오케스트레이터 어댑터 탑재.'
  summary_en: Eliminated all silent exception handlers across 136 unit tests, migrated hardware acceleration to ameva-runtime v2, and integrated cluster orchestrator adapter.
  changes:
  - Purged all bare except:pass blocks and subprocess exception black holes (136 unit tests verified).
  - Migrated hardware acceleration dependency to ameva-runtime v2.
  - Integrated AMEVA cluster orchestrator control-plane adapter.
  - Added live Snapdragon S25 and Exynos A53 E2E telemetry recipes.
