package_name_npm: termux-aichain
version: v1.2.0
release_name: Fail-Fast Zero-Silent-Exception & ameva-runtime v2 Integration
license: Apache-2.0
platform: Android Termux (ARM64) / Python 3.10+ / Node.js 18+ ESM
github_repo_url: https://github.com/uno-km/termux-aichain
tagline_en: Why LangChain on Termux? Bloat & Crash vs 94KB Zero-Dep LCEL & Hardware Native Agents
tagline_ko: 왜 터먹스에선 랭체인 대신 AIChain인가? 수백MB 의존성 폭탄 vs 94KB 제로-의존성 LCEL 및 하드웨어 액추에이션
quick_install_cmd: 'pip install termux-aichain

  # or:

  npm install termux-aichain'
why_challenge_en: Standard enterprise frameworks (LangChain, LlamaIndex, CrewAI) pull in 45+ heavy dependencies (Pydantic-core, Chroma, Tiktoken) weighing 200MB+ that constantly fail to compile on Android Bionic ARM64 and trigger instant Out-Of-Memory (LMK) kernel kills.
why_challenge_ko: 기존 LangChain 및 LlamaIndex는 45개 이상의 무거운 외부 의존성(Pydantic-core, ChromaDB, Tiktoken)으로 인해 안드로이드 Bionic ARM64에서 C/Rust 컴파일 오류를 일으키고, 180MB가 넘는 유휴 메모리 점유로 안드로이드 LMK(Low Memory Killer)에 의해 프로세스가 즉각 강제 종료됩니다.
description_en: Termux-AIChain provides 100% pure standard-library LCEL pipe chaining (prompt | llm | parser), autonomous StateGraph agents, on-device SQLite vector RAG, and first-class Android smartphone hardware actuation (battery, temperature, haptics, GPS) in a tiny 94KB footprint.
description_ko: 외부 의존성 0개(Zero-Dependency)의 순수 표준 라이브러리 기반으로 LangChain 호환 LCEL 파이프 체이닝(prompt | llm | parser), StateGraph 자율 에이전트, 온디바이스 SQLite 코사인 벡터 검색, 스마트폰 하드웨어 직접 제어(배터리, 온도, 진동, GPS)를 94KB 초경량 코어로 완벽히 제공합니다.
code_example_py: 'from termux_aichain import PromptTemplate, OpenAICompatibleChat, StringOutputParser, get_battery_status


  # 1. Read physical smartphone hardware telemetry

  battery = get_battery_status()


  # 2. Build LCEL Chain connected to local llama-server (port 8080)

  prompt = PromptTemplate.from_template("Phone Telemetry: {status}. Diagnose in 1 sentence:")

  llm = OpenAICompatibleChat(base_url="http://127.0.0.1:8080/v1", model="llama3", temperature=0.3)

  chain = prompt | llm | StringOutputParser()


  # 3. Execute with 0 external dependencies

  report = chain.invoke({"status": battery})

  print("AI Diagnostic:", report)'
code_example_js: 'import { PromptTemplate, OpenAICompatibleChat, StringOutputParser, getBatteryStatus } from ''termux-aichain'';


  // 1. Read physical smartphone hardware telemetry

  const battery = await getBatteryStatus.func();


  // 2. Build LCEL Chain connected to local llama-server (port 8080)

  const prompt = PromptTemplate.fromTemplate(''Phone Telemetry: {status}. Diagnose in 1 sentence:'');

  const llm = new OpenAICompatibleChat({ baseUrl: ''http://127.0.0.1:8080/v1'', model: ''llama3'', temperature: 0.3 });

  const chain = prompt.pipe(llm).pipe(new StringOutputParser());


  // 3. Execute with 0 npm dependencies

  const report = await chain.invoke({ status: JSON.stringify(battery) });

  console.log(''AI Diagnostic:'', report);'
features:
- title_en: Zero External Dependencies (94KB)
  title_ko: 외부 의존성 0개 (94KB 초경량)
  desc_en: Written entirely in Python stdlib (urllib, sqlite3, json) and Node.js ESM. No C/Rust compiler required on Android Bionic ARM64.
  desc_ko: 순수 파이썬 표준 라이브러리와 Node.js ESM으로만 작성되어 안드로이드 Bionic ARM64에서 빌드 툴 없이 즉각 구동됩니다.
- title_en: LCEL Pipeline Compatibility
  title_ko: LangChain LCEL 파이프라인 100% 호환
  desc_en: Full Runnable Protocol support with the pipe operator (prompt | llm | parser) and real-time streaming chunk emission.
  desc_ko: 파이프 연산자(|)를 통한 체인 결합과 실시간 토큰 스트리밍을 표준 LangChain 문법 그대로 지원합니다.
- title_en: Native Smartphone Hardware Actuation
  title_ko: 스마트폰 물리 하드웨어 직접 제어
  desc_en: Built-in first-class tools for Android kernel battery, surface temperature, GPS coordinates, haptic vibration, and system notifications.
  desc_ko: 배터리 잔량, 표면 온도, GPS 좌표 수집, 햅틱 진동 및 시스템 알림 발송 도구가 1급 시민으로 내장되어 있습니다.
- title_en: On-Device SQLite Vector Store (RAG)
  title_ko: 온디바이스 SQLite 코사인 벡터 검색
  desc_en: 'Embeddings storage and pure-math cosine similarity search in SQLite :memory: or local DB without ChromaDB or FAISS.'
  desc_ko: Chroma나 FAISS 없이 모바일 내장 SQLite를 통해 인메모리 또는 로컬 파일 기반 코사인 유사도 벡터 검색을 지원합니다.
